openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                parentId: { type: string, minLength: 1, description: "可选，指向未完成的顶层任务" }
                priority: { $ref: "#/components/schemas/Priority" }
                workload: { $ref: "#/components/schemas/Workload" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态、到期日、优先级或工作量
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                workload: { $ref: "#/components/schemas/Workload" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  schemas:
    Priority:
      type: integer
      enum: [1, 2, 3]
      description: "1 高、2 中、3 低"
    Workload:
      type: string
      enum: [small, medium, large]
      description: "工作量为小、中或大"
    DueDate:
      type: string
      format: date
      description: 可选的本地日历日期，格式 YYYY-MM-DD
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        dueDate: { $ref: "#/components/schemas/DueDate" }
        parentId: { type: string, description: "所属父任务 ID，仅子任务返回" }
        priority: { $ref: "#/components/schemas/Priority" }
        workload: { $ref: "#/components/schemas/Workload" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    Conflict:
      description: 操作与父子任务的当前状态冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
